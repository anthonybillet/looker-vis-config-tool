<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Looker Explore URL to vis_config Extractor</title>
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
</head>
<body class="bg-transparent text-[var(--foreground)] antialiased p-4">
  <div class="bg-[var(--card)] text-[var(--foreground)] border border-[var(--border)] rounded-xl p-4 shadow-sm space-y-3">
    <div class="flex flex-wrap items-center justify-between gap-2 border-b border-[var(--border)] pb-2.5">
      <div>
        <h2 class="text-[var(--foreground)] font-semibold text-base">Looker <code class="font-mono text-xs px-1.5 py-0.5 rounded bg-[var(--secondary)] text-[var(--secondary-foreground)]">{% assign vis_config %}</code> Extractor</h2>
        <p class="text-[var(--muted-foreground)] text-xs mt-0.5">Paste a Looker <strong>Share &rarr; Expanded URL</strong> to get the escaped <code class="font-mono">assign vis_config</code> snippet.</p>
      </div>
      <div class="flex items-center gap-2">
        <button id="loadSampleBtn" type="button" class="text-xs px-2.5 py-1 rounded-md border border-[var(--border)] bg-[var(--secondary)] text-[var(--secondary-foreground)] hover:opacity-90 transition font-medium">
          Sample URL
        </button>
        <button id="clearBtn" type="button" class="text-xs px-2.5 py-1 rounded-md border border-[var(--border)] text-[var(--muted-foreground)] hover:text-[var(--foreground)] transition">
          Clear
        </button>
      </div>
    </div>

    <textarea
      id="urlInput"
      rows="2"
      placeholder="Paste Looker Expanded URL here..."
      class="w-full rounded-lg border border-[var(--border)] bg-[var(--background)] text-[var(--foreground)] placeholder-[var(--placeholder)] p-2.5 text-xs font-mono focus:outline-none focus:ring-1 focus:ring-[var(--primary)]"
    ></textarea>

    <div>
      <div class="flex items-center justify-between mb-1.5">
        <div id="statusBadge" class="text-xs text-[var(--muted-foreground)] font-mono">Waiting for Expanded URL...</div>
        <button id="copyBtn" type="button" class="text-xs px-3 py-1 rounded-md bg-[var(--primary)] text-[var(--primary-foreground)] font-medium hover:opacity-90 transition">
          Copy Snippet
        </button>
      </div>
      <pre id="outputCode" class="w-full rounded-lg border border-[var(--border)] bg-[var(--background)] text-[var(--foreground)] p-3 text-xs font-mono overflow-x-auto max-h-56 whitespace-pre"># Paste an Expanded URL above</pre>
    </div>
  </div>

  <script>
    const SAMPLE_URL = "https://instance.cloud.looker.com/explore/thelook/order_items?fields=order_items.created_date,order_items.total_sale_price&vis=%7B%22stacking%22%3A%22%22%2C%22show_value_labels%22%3Afalse%2C%22label_density%22%3A25%2C%22legend_position%22%3A%22center%22%2C%22x_axis_gridlines%22%3Atrue%2C%22y_axis_gridlines%22%3Atrue%2C%22show_view_names%22%3Afalse%2C%22limit_displayed_rows%22%3Afalse%2C%22y_axis_combined%22%3Atrue%2C%22show_y_axis_labels%22%3Atrue%2C%22show_y_axis_ticks%22%3Atrue%2C%22y_axis_tick_density%22%3A%22default%22%2C%22y_axis_tick_density_custom%22%3A5%2C%22show_x_axis_label%22%3Afalse%2C%22show_x_axis_ticks%22%3Atrue%2C%22x_axis_scale%22%3A%22auto%22%2C%22y_axis_scale_mode%22%3A%22linear%22%2C%22show_null_points%22%3Atrue%2C%22point_style%22%3A%22circle%22%2C%22ordering%22%3A%22none%22%2C%22show_null_labels%22%3Afalse%2C%22show_totals_labels%22%3Afalse%2C%22show_silhouette%22%3Afalse%2C%22totals_color%22%3A%22%23808080%22%2C%22type%22%3A%22looker_scatter%22%2C%22interpolation%22%3A%22linear%22%2C%22series_types%22%3A%7B%7D%2C%22colors%22%3A%5B%22palette%3A+Santa+Cruz%22%5D%2C%22series_colors%22%3A%7B%7D%2C%22x_axis_datetime_tick_count%22%3Anull%2C%22trend_lines%22%3A%5B%7B%22color%22%3A%22%23000000%22%2C%22label_position%22%3A%22left%22%2C%22period%22%3A30%2C%22regression_type%22%3A%22average%22%2C%22series_index%22%3A1%2C%22show_label%22%3Atrue%2C%22label_type%22%3A%22string%22%2C%22label%22%3A%2230+day+moving+average%22%7D%5D%7D&filter_config=%7B%7D";

    const urlInput = document.getElementById('urlInput');
    const outputCode = document.getElementById('outputCode');
    const statusBadge = document.getElementById('statusBadge');
    const copyBtn = document.getElementById('copyBtn');
    const loadSampleBtn = document.getElementById('loadSampleBtn');
    const clearBtn = document.getElementById('clearBtn');

    function formatVisConfig(obj) {
      const jsonPretty = JSON.stringify(obj, null, 2);
      const lines = jsonPretty.split('\n');
      const formattedLines = lines.map((line, idx) => {
        if (idx === 0) return line;
        const escaped = line
          .replace(/\\/g, '\\\\')
          .replace(/"/g, '\\"')
          .replace(/'/g, "\\'");
        return '   ' + escaped;
      });
      return `{% assign vis_config = '${formattedLines.join('\n')}' %}`;
    }

    function render() {
      const raw = urlInput.value.trim();
      if (!raw) {
        outputCode.textContent = '# Paste an Expanded URL above';
        statusBadge.textContent = 'Waiting for Expanded URL...';
        return;
      }
      try {
        const qIdx = raw.indexOf('?');
        const qs = qIdx !== -1 ? raw.slice(qIdx + 1) : raw;
        const params = new URLSearchParams(qs);
        let visStr = params.get('vis') || params.get('vis_config');
        if (!visStr && raw.startsWith('{')) visStr = raw;
        if (!visStr) throw new Error("No 'vis=' parameter found. Make sure you copied the 'Expanded URL' from Share.");

        let visObj;
        try { visObj = JSON.parse(visStr); }
        catch (_) { visObj = JSON.parse(decodeURIComponent(visStr)); }

        statusBadge.textContent = `Extracted vis_config (${Object.keys(visObj).length} properties)`;
        outputCode.textContent = formatVisConfig(visObj);
      } catch (e) {
        statusBadge.textContent = 'Error';
        outputCode.textContent = e.message;
      }
    }

    urlInput.addEventListener('input', render);
    loadSampleBtn.addEventListener('click', () => { urlInput.value = SAMPLE_URL; render(); });
    clearBtn.addEventListener('click', () => { urlInput.value = ''; render(); });
    copyBtn.addEventListener('click', () => {
      navigator.clipboard.writeText(outputCode.textContent);
      copyBtn.textContent = 'Copied!';
      setTimeout(() => { copyBtn.textContent = 'Copy Snippet'; }, 1500);
    });

    urlInput.value = SAMPLE_URL;
    render();
  </script>
</body>
</html>
